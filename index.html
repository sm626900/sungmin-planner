<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성민 공부 플래너</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="플래너">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#000; --sub:#8a8a8e; --sub2:#3c3c4399; --sep:#c6c6c8; --fill:#7676801f; --fill2:#78788029;
  --tint:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --purple:#af52de; --teal:#30b0c7; --indigo:#5856d6; --pink:#ff2d55; --brown:#a2845e; --gray:#8e8e93;
  --shadow:0 0 0 .5px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --text:#fff; --sub:#8d8d93; --sub2:#ebebf599; --sep:#38383a; --fill:#7676803d; --fill2:#7878805c;
    --tint:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6; --pink:#ff375f; --brown:#ac8e68; --gray:#8e8e93; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.3;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1180px}

/* 상단 */
.nav{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.nav .lnk{border:0;background:none;color:var(--tint);font-size:17px;padding:6px 0}
.nav .sync{font-size:12px;color:var(--sub)}
.lt{font-size:34px;font-weight:700;letter-spacing:.2px;margin:2px 0 2px}
.lsub{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:15px;margin-bottom:14px}
.lsub .chev{border:0;background:var(--fill);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--tint)}
.lsub .chev svg{width:14px;height:14px}
.lsub .dt{flex:1;font-weight:600;color:var(--text)}
.pill{border:0;background:var(--fill);color:var(--tint);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:600}

/* 그룹 리스트 */
.sec{margin:0 0 22px}
.sh{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:0;padding:0 16px 6px;display:flex;justify-content:space-between;align-items:flex-end}
.sh .r{text-transform:none;font-size:15px;color:var(--tint);background:none;border:0;padding:0}
.sf{font-size:13px;color:var(--sub);padding:6px 16px 0;line-height:1.35}
.grp{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.rw{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 16px;width:100%;border:0;background:none;text-align:left}
.rw + .rw::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.rw.ind + .rw::before,.rw + .rw.ind::before{left:52px}
button.rw:active,.rw.tap:active{background:var(--fill)}
.rw .mid{flex:1;min-width:0}
.rw .tt{font-size:17px}
.rw .st{font-size:13px;color:var(--sub);margin-top:2px}
.rw .val{color:var(--sub);font-size:17px;white-space:nowrap}
.rw .chv{width:8px;height:13px;color:#c4c4c7;flex:none}
.rw.add .tt{color:var(--tint)}
.rw.danger .tt{color:var(--red)}
.rw .ck{color:var(--tint);width:18px;height:18px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.done .tt{color:var(--sub);text-decoration:line-through}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.b-or{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.b-pu{background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple)}
.b-bl{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.b-gr{background:color-mix(in srgb,var(--gray) 18%,transparent);color:var(--sub)}

/* 동그라미 체크 */
.cc{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c7c7cc;background:none;display:grid;place-items:center;padding:0;transition:.15s}
.cc svg{width:14px;height:14px;opacity:0;color:#fff}
.cc.on{background:var(--green);border-color:var(--green)}
.cc.on svg{opacity:1}
.cc:active{transform:scale(.9)}

/* 스위치 */
.sw{flex:none;width:51px;height:31px;border-radius:999px;border:0;background:var(--fill2);position:relative;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}

/* 세그먼트 */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:0;width:100%}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 6px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme: dark){.seg button.on{background:#636366}}
.segwrap{padding:0 0 16px}

/* 요일 알약 */
.days{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto}
.days button{flex:1;min-width:42px;border:0;background:var(--card);border-radius:12px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow)}
.days button small{font-size:11px;color:var(--sub)}
.days button b{font-size:16px;font-weight:600}
.days button.on{background:var(--tint);color:#fff}
.days button.on small{color:#ffffffcc}
.days button .mk{width:5px;height:5px;border-radius:50%;background:var(--orange)}
.days button.on .mk{background:#fff}

/* 요약 카드 */
.sum{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:22px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700}
.sum .stat{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .stat div small{display:block;font-size:12px;color:var(--sub)}
.sum .stat div span{font-size:17px;font-weight:600}
.now{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:22px}
.now .bar{width:4px;align-self:stretch;border-radius:2px}
.now small{color:var(--sub);font-size:13px}
.now .nt{font-size:17px;font-weight:600}

/* 시간표 */
.tl .ev{display:flex;gap:10px;align-items:stretch;padding:7px 12px 7px 16px;position:relative}
.tl .ev + .ev::before{content:"";position:absolute;top:0;left:84px;right:0;height:.5px;background:var(--sep)}
.tl .tm{width:58px;flex:none;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:2px;line-height:1.25}
.tl .bx{flex:1;display:flex;gap:9px;border-radius:8px;padding:6px 9px;align-items:center}
.tl .bx .lb{width:3px;align-self:stretch;border-radius:2px}
.tl .bx .ttl{flex:1;font-size:15px;font-weight:500}
.tl .bx .nt{font-size:12px;color:var(--sub);font-weight:400}
.tl .ev.cur .bx{box-shadow:inset 0 0 0 2px var(--tint)}
.tag{border:0;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card)}
.tl .ev.mini .bx{padding:3px 9px}
.tl .ev.mini .ttl{font-size:13px;color:var(--sub);font-weight:400}

/* 주간 */
.week{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}
.wc{background:var(--card);border-radius:14px;padding:10px 8px;box-shadow:var(--shadow);scroll-snap-align:start}
.wc.today{box-shadow:0 0 0 2px var(--tint)}
.wh{display:flex;align-items:center;justify-content:space-between;border:0;background:none;width:100%;padding:0 2px 8px}
.wh b{font-size:17px}
.wh small{color:var(--sub);font-size:12px;display:block;text-align:left}
.wb{display:flex;gap:5px;font-size:12px;line-height:1.3;padding:3px 5px;border-radius:6px;margin-bottom:3px}
.wb i{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.mring{width:30px;height:30px}
.mring svg{width:30px;height:30px;transform:rotate(-90deg)}

/* 시트 */
/* 닫혔을 때는 색도 없애고 숨긴다. iOS가 위에 고정된 요소 색으로 상태 표시줄을 칠해서, 투명하게만 두면 회색 띠가 남는다 */
.scrim{position:fixed;inset:0;background:transparent;z-index:40;pointer-events:none;visibility:hidden;transition:background-color .25s,visibility 0s linear .25s}
.scrim.on{background:rgba(0,0,0,.35);pointer-events:auto;visibility:visible;transition:background-color .25s,visibility 0s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92vh;background:var(--bg);border-radius:14px 14px 0 0;z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:6px auto 0}
.sheet .shd{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px}
.sheet .shd b{font-size:17px;font-weight:600;text-align:center;flex:1}
.sheet .shd button{border:0;background:none;color:var(--tint);font-size:17px;min-width:60px;text-align:left;padding:4px 0}
.sheet .shd button.r{text-align:right;font-weight:600}
.sheet .sbody{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-radius:14px;transform:translateY(-40%) scale(.98);opacity:0;pointer-events:none;transition:.22s}.sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}.sheet .grab{display:none}}

/* 입력 */
.rw input[type=text],.rw input[type=number]{border:0;background:none;text-align:right;color:var(--sub);font-size:17px;min-width:0;width:100%;outline:none}
.rw input.left{text-align:left;color:var(--text)}
.rw input[type=time],.rw input[type=date],.rw select{border:0;background:var(--fill);border-radius:7px;padding:5px 9px;font-size:16px;color:var(--text);min-width:0;-webkit-appearance:none;appearance:none}
.rw textarea{border:0;background:none;width:100%;min-height:60px;resize:vertical;outline:none;font-size:16px}
.step{display:flex;align-items:center;background:var(--fill);border-radius:8px;overflow:hidden}
.step button{border:0;background:none;width:40px;height:30px;font-size:20px;color:var(--text)}
.step span{min-width:64px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}
.btn{border:0;background:var(--tint);color:#fff;border-radius:12px;padding:13px 16px;font-size:17px;font-weight:600;width:100%}
.btn.gray{background:var(--card);color:var(--tint);box-shadow:var(--shadow)}
.chipb{border:0;background:var(--fill);color:var(--tint);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;box-shadow:var(--shadow)}
.banner .ic{width:22px;height:22px;flex:none;color:var(--orange)}
.banner.info .ic{color:var(--tint)}
.mono{font-variant-numeric:tabular-nums}

/* 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(4px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:#999;font-size:10.5px;font-weight:500;padding:2px 0}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--tint)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--text);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.15);max-width:90%;text-align:center;transition:opacity .2s}
.hide{display:none!important}
.prog{height:4px;background:var(--fill);border-radius:99px;overflow:hidden;margin:0 4px 8px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.lst{padding:2px 0}
.li{position:relative;display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 16px}
.li + .li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.li .lt2{width:44px;flex:none;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.li .ln{flex:1;font-size:17px}
.li .ltag{font-size:14px;font-weight:600}
.li.past .ln,.li.past .lt2{opacity:.45}
.li.on{background:color-mix(in srgb,var(--tint) 9%,transparent)}
.li.on .ln{font-weight:700}
.li.on .lt2{color:var(--tint);font-weight:600}
.cal{position:relative;background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.cal .hr{position:absolute;left:46px;right:0;height:0;border-top:.5px solid var(--sep)}
.cal .hr span{position:absolute;left:-42px;top:-7px;width:36px;text-align:right;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.cal .hr.sleep{border-top:1px dashed var(--sub)}
.cal .hr.sleep em{position:absolute;left:10px;top:3px;font-style:normal;font-size:12px;color:var(--sub);font-weight:600}
.cev{z-index:1;position:absolute;left:52px;right:8px;border-left:3px solid;border-radius:5px;padding:3px 8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
.cev b{font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev small{font-size:12px;color:var(--sub);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev.one{flex-direction:row;align-items:center;gap:8px;padding-top:0;padding-bottom:0}
.cev.one b{font-size:13px}
.cev.one small{font-size:11px}
.nowl{position:absolute;left:46px;right:0;height:0;border-top:1.5px solid var(--red);z-index:2}
.nowl::before{content:"";position:absolute;left:-5px;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:8px 16px 0;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ===== 다듬기 ===== */
#view.fade{animation:fadeUp .35s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view.fade .cc.on,#view.fade .pp.on{animation:none}
button{transition:transform .12s ease,background-color .2s ease,color .2s ease,opacity .2s ease}
button:active{transform:scale(.97)}
.rw.tap:active,button.rw:active{transform:none}
.cc{transition:background-color .22s ease,border-color .22s ease,transform .12s ease}
.cc.on{animation:pop .38s cubic-bezier(.34,1.56,.64,1)}
.cc svg path{stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .28s ease .05s}
.cc.on svg path{stroke-dashoffset:0}
.cc.dash{border-style:dashed}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.rw .tt{transition:color .25s ease,opacity .25s ease}
.done .tt{text-decoration:none;opacity:.45}
.prog{height:6px;background:var(--fill);border-radius:99px;overflow:hidden;margin:0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#30d158,#34c759);border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.progbox{background:var(--card);border-radius:14px;padding:12px 16px 14px;margin-bottom:18px;box-shadow:var(--shadow)}
.progbox .row2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.progbox .row2 span{font-size:15px;color:var(--sub);font-weight:500}
.progbox .row2 b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.progbox .row2 b small{font-size:15px;color:var(--sub);font-weight:500}
.sh .hint{text-transform:none;font-size:12px;color:var(--sub)}
.banner.tap{cursor:pointer}
/* 세로 타임라인 */
.tl2{padding:6px 0}
.ti{position:relative;display:flex;align-items:center;gap:12px;padding:7px 16px 7px 14px;min-height:52px}
.ti.tap{cursor:pointer}
.ti.tap:active{background:var(--fill)}
.ti .rail{position:relative;width:14px;align-self:stretch;flex:none}
.ti .rail::before{content:"";position:absolute;left:6px;top:-7px;bottom:-7px;width:2px;background:var(--fill2);border-radius:1px}
.ti.first .rail::before{top:50%}
.ti.last .rail::before{bottom:50%}
.ti .rail i{position:absolute;left:0;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2.5px solid;box-sizing:border-box;transition:background .3s,box-shadow .3s}
.ti .tx{flex:1;min-width:0}
.ti .tm{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;margin-bottom:1px}
.ti .nm{font-size:16px;font-weight:500}
.ti .tg{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none}
.ti.past .tx,.ti.past .tg{opacity:.4}
.ti.on .nm{font-weight:700}
.ti.on{background:color-mix(in srgb,var(--tint) 7%,transparent)}
/* 나눠서 체크 */
.pps{display:flex;gap:6px;flex:none}
.pp{display:flex;align-items:center;gap:4px;border:1.5px solid #c7c7cc;background:none;border-radius:999px;padding:4px 10px 4px 7px;font-size:13px;font-weight:600;color:var(--sub);transition:background-color .22s,border-color .22s,color .22s}
.pp svg{width:12px;height:12px;color:#c7c7cc;transition:color .2s}
.pp.on{background:var(--green);border-color:var(--green);color:#fff;animation:pop .38s cubic-bezier(.34,1.56,.64,1)}
.pp.on svg{color:#fff}
.xbtn{border:0;background:none;color:var(--sub);font-size:15px;padding:4px 6px}
/* 요일 고르기 */
.dps{display:flex;gap:6px}
.dp{flex:1;border:0;background:var(--fill);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center}
.dp small{font-size:11px;color:var(--sub)}
.dp b{font-size:16px;font-weight:600}
.dp.on{background:var(--tint);color:#fff}
.dp.on small{color:#ffffffcc}
.dp:disabled{opacity:.3}
.rw[disabled]{pointer-events:none}
.step.sm button{width:30px;height:28px;font-size:17px}
.step.sm span{min-width:52px;font-size:13px}
/* 아래 작은 링크 (이용약관처럼) */
.foot{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0 10px;font-size:12px;color:var(--sub)}
.foot button{border:0;background:none;color:var(--sub);font-size:12px;padding:4px 2px;text-decoration:underline;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,var(--sub) 45%,transparent)}
.foot i{font-style:normal;opacity:.6}
.sheet .sbody{scroll-behavior:smooth}
.rw input[type=time]{flex:none;min-width:118px}

/* 현재 시각 */
.clock{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.clock .ck{display:flex;align-items:baseline;gap:6px;padding-right:16px;border-right:.5px solid var(--sep)}
.clock .ck .ap{font-size:14px;color:var(--sub);font-weight:600}
.clock .ck b{font-size:40px;font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.clock .cn{flex:1;min-width:0}
.clock .cn small{display:block;font-size:12px;color:var(--sub)}
.clock .cn div{font-size:17px;font-weight:700;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowpill{display:inline-flex;align-items:center;gap:5px;text-transform:none;font-size:12px;font-weight:600;color:var(--red);font-variant-numeric:tabular-nums}
.nowpill i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}
/* 타임라인: 시작 시각만 */
.ti .t0{width:42px;flex:none;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.ti.on .t0{color:var(--tint);font-weight:700}
.ti.past .t0{opacity:.4}
/* 주간 일정표 격자 */
.wg{--u:6px;display:grid;grid-template-columns:24px repeat(7,minmax(0,1fr));column-gap:3px;background:var(--card);border-radius:14px;padding:4px 6px 10px 2px;box-shadow:var(--shadow);position:relative}
@media (min-width:700px){.wg{--u:8px;grid-template-columns:34px repeat(7,minmax(0,1fr));column-gap:5px;padding:6px 10px 12px 4px}}
.wg .dh{grid-row:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
.wg .dh small{font-size:10px;color:var(--sub)}
.wg .dh b{font-size:14px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.wg .dh.td b{background:var(--red);color:#fff}
.wg .tdbg{background:color-mix(in srgb,var(--tint) 5%,transparent);border-radius:6px}
.wg .hl{grid-column:1;font-size:9.5px;color:var(--sub);text-align:right;padding-right:3px;align-self:start;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wg .ln{grid-column:2/-1;border-top:.5px solid var(--sep);align-self:start;height:0}
.wg .bk{z-index:1;border-left:2.5px solid;border-radius:4px;padding:1px 3px;overflow:hidden;font-size:10.5px;line-height:1.2;margin-bottom:1px;cursor:pointer;display:flex;flex-direction:column}
.wg .bk b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg .bk small{font-size:9.5px;color:var(--sub);white-space:nowrap}
@media (min-width:700px){.wg .bk{font-size:12px;padding:2px 5px}.wg .hl{font-size:11px}}
.wg .sl{grid-row-end:span 1;border-top:1px dashed var(--sub);align-self:start;height:0;opacity:.6}
.wg .nowg{z-index:2;position:relative;pointer-events:none}
.wg .nowg::before{content:"";position:absolute;left:-3px;right:0;top:calc(var(--y) * var(--u));border-top:1.5px solid var(--red)}
.wg .nowg::after{content:"";position:absolute;left:-5px;top:calc(var(--y) * var(--u) - 3.5px);width:8px;height:8px;border-radius:50%;background:var(--red)}

/* 시작–끝 시각 (한눈에) */
.ti .t0{width:46px;flex:none;display:flex;flex-direction:column;line-height:1.15;font-variant-numeric:tabular-nums}
.ti .t0 b{font-size:15px;font-weight:600;color:var(--text)}
.ti .t0 small{font-size:12px;color:var(--sub)}
.ti.on .t0 b{color:var(--c)}
.ti.past .t0{opacity:.4}
/* 지금 하는 칸: 깜빡이는 효과 */
.ti.on{background:color-mix(in srgb,var(--c) 9%,transparent);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{background:color-mix(in srgb,var(--c) 6%,transparent)}50%{background:color-mix(in srgb,var(--c) 16%,transparent)}}
.ti.on .rail i{background:var(--c)!important;border-color:var(--c)!important}
.ti.on .rail i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.ti .pbar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 18%,transparent);margin:5px 0 2px;overflow:hidden;max-width:220px}
.ti .pbar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width 1s linear}
.ti .left{font-size:12px;color:var(--c);font-weight:600}
.ti .left.soon{color:var(--orange);animation:blink 1.4s ease-in-out infinite}
.ti.soon .rail i{animation:soonDot 1.4s ease-in-out infinite}
@keyframes soonDot{50%{transform:scale(1.25)}}
/* 시계 */
.clock{position:relative;overflow:hidden}
.clock::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.clock .colon{animation:blink 1s steps(1) infinite;display:inline-block;width:.3em;text-align:center}
.clock .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px;animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 0%,transparent)}}
.clock .cn small + small,.clock .cn div + small{margin-top:2px}
/* 다 했을 때 */
.progbox.full .prog i{background:linear-gradient(90deg,#30d158,#34c759,#7ee8a2,#34c759);background-size:200% 100%;animation:shine 2s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.progbox.full .row2 span{color:var(--green);font-weight:700;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
/* 밀린 숙제 표시 */
.badge.b-or{animation:blink 2s ease-in-out infinite}
/* 주간표 지금 칸 */
.wg .bk.on{box-shadow:0 0 0 2px var(--c);animation:glow 1.8s ease-in-out infinite;z-index:3}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--c),0 0 10px 2px color-mix(in srgb,var(--c) 45%,transparent)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* 칸 안 할 일 */
.tks{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.tk{display:flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;text-align:left;font-size:13px;color:var(--text);max-width:100%}
.tk .o{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #c7c7cc;display:grid;place-items:center;transition:background-color .2s,border-color .2s}
.tk .o svg{width:9px;height:9px;color:#fff;opacity:0;transition:opacity .2s}
.tk.on .o{background:var(--green);border-color:var(--green);animation:pop .38s cubic-bezier(.34,1.56,.64,1)}
.tk.on .o svg{opacity:1}
.tk .tx2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.on .tx2{color:var(--sub);text-decoration:line-through}
.when{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border:0;background:color-mix(in srgb,var(--tint) 10%,transparent);color:var(--tint);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600;margin-top:5px;margin-right:5px}
.when::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.when.none{background:color-mix(in srgb,var(--orange) 12%,transparent);color:var(--orange)}
.whens{display:flex;flex-wrap:wrap}
.t0x{width:44px;flex:none;display:flex;flex-direction:column;line-height:1.15;font-variant-numeric:tabular-nums}
.t0x b{font-size:15px;font-weight:600}.t0x small{font-size:12px;color:var(--sub)}

/* 칸 오른쪽: 공부 종류 + 걸리는 시간 */
.ti .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.ti .dur{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.sh .tot{text-transform:none;font-size:12px;color:var(--sub)}
.sh .tot b{color:var(--text);font-weight:700}
/* 지금 칸 효과는 칸 안에서만 */
.ti{overflow:hidden;isolation:isolate}

@keyframes pingIn{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.7);opacity:0}}
.ti.on{box-shadow:inset 3px 0 0 var(--c)}
/* 주간표 새 디자인: 얇고 가볍게 */
.wg{--u:5px;column-gap:2px;padding:6px 6px 10px 2px}
@media (min-width:700px){.wg{--u:7px;column-gap:4px}}
.wg .ln{border-top:.5px solid color-mix(in srgb,var(--sep) 60%,transparent)}
.wg .hl{font-size:9px;opacity:.8}
.wg .bk{border-left:2px solid var(--c);border-radius:3px;padding:1px 3px;margin:0 0 1px;background:color-mix(in srgb,var(--c) 13%,var(--card));font-size:10px;line-height:1.15}
.wg .bk b{font-weight:600;color:color-mix(in srgb,var(--c) 75%,var(--text))}
.wg .bk.mu{background:color-mix(in srgb,var(--gray) 7%,var(--card));border-left-color:color-mix(in srgb,var(--c) 45%,transparent)}

.wg .bk.xs{padding:0}
@media (min-width:700px){.wg .bk{font-size:11.5px;padding:2px 5px}}
.wg .bk.on{box-shadow:inset 0 0 0 1.5px var(--c);animation:glowIn 1.8s ease-in-out infinite}
@keyframes glowIn{50%{background:color-mix(in srgb,var(--c) 30%,var(--card))}}
.wg .dh b{width:22px;height:22px;font-size:13px}

/* 정리된 상단 · 할 일 */
.navr{display:flex;gap:6px}
.ibtn2{border:0;background:var(--fill);color:var(--tint);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:500;padding:0;line-height:1}
.ibtn2 svg{width:19px;height:19px}
.tmb{flex:none;border:0;background:color-mix(in srgb,var(--tint) 10%,transparent);color:var(--tint);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tmb.none{background:color-mix(in srgb,var(--orange) 12%,transparent);color:var(--orange)}
.pl{font-size:13px;color:var(--sub);font-weight:500;margin-left:2px}
.tmb.late{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}

/* 끌어서 옮기기 · 빠른 추가 */
.tk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:6px}
.tk.dragsrc{opacity:.3}

.tkadd{align-self:flex-start;border:0;background:var(--fill);color:var(--tint);width:24px;height:22px;border-radius:7px;font-size:15px;line-height:1;padding:0;opacity:.7}
.tkadd:hover{opacity:1}

.dps.scroll .dp{min-width:46px}
.dsel{border:0;background:var(--fill);border-radius:7px;padding:3px 7px;font-size:13px;text-transform:none}
.pastrow{opacity:.45}

/* 타이머 */
.tbig{background:var(--card);border-radius:20px;padding:22px 16px 18px;margin-bottom:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px}
.tring{position:relative;width:220px;height:220px}
.tring svg{width:220px;height:220px;transform:rotate(-90deg)}
.tin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tin small{font-size:13px;color:var(--sub)}

.tbig.run .tin span{color:var(--c)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--red));animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c,var(--red)) 60%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.tbig.run .tring svg circle:last-child{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 50%,transparent))}
.tstop{border:0;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-weight:700;font-size:16px;border-radius:999px;padding:10px 26px}

.tsub.on{background:color-mix(in srgb,var(--c) 10%,transparent);animation:breathe2 2.4s ease-in-out infinite}

.tsub.on .tsec{color:var(--c);font-weight:700}
.tsub.on .tplay{background:var(--c);color:#fff}
.wkbar{display:flex;align-items:flex-end;gap:8px;height:150px;padding:14px 14px 10px}

.runbar{width:100%;display:flex;align-items:center;gap:8px;border:0;background:color-mix(in srgb,var(--red) 9%,var(--card));color:var(--text);border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:15px;box-shadow:var(--shadow)}

.tabbar button.rec svg{color:var(--red)}
.tabbar button.rec::after{content:"";position:absolute;margin-left:16px;margin-top:2px;width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}

/* 부드러운 끌기 */
.tk{transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s,background-color .2s}

.tk.ghost.land{transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s,box-shadow .22s;box-shadow:0 2px 6px rgba(0,0,0,.06)}

@keyframes landed{0%{transform:scale(.85);background:color-mix(in srgb,var(--tint) 18%,transparent)}100%{transform:scale(1);background:transparent}}
.ti{transition:background-color .2s ease,outline-color .2s ease}
body.dragmode .ti[data-drop]{outline:1.5px dashed color-mix(in srgb,var(--c) 40%,transparent);outline-offset:-4px}

.pbtn{border:0;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;transition:background-color .25s,color .25s,transform .15s}

.tpl .tt{font-size:16px}
.tg2{font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:1px}

.tpl .tplay{border:0}

.tplay{transition:background-color .25s,color .25s,transform .15s}

.ti.rest{min-height:30px;padding-top:3px;padding-bottom:3px}

.chkin{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.chkin span{font-size:12px;color:var(--sub);margin-right:2px}

.durpills{display:flex;flex-wrap:wrap;gap:6px}
.durpills button{border:0;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;background:color-mix(in srgb,var(--gray) 13%,transparent);color:var(--text);cursor:pointer;transition:background-color .2s,color .2s}
.durpills button.on{background:var(--tint);color:#fff;font-weight:600}
.navl{display:flex;align-items:center;gap:10px;min-width:0}
.undob,.sundo{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:5px 11px 5px 9px;background:color-mix(in srgb,var(--tint) 12%,transparent);color:var(--tint);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s}
.undob:active,.sundo:active{transform:scale(.94)}
.sheet .shd button.sundo{padding:4px 10px 4px 8px;font-size:13px;min-width:0;background:color-mix(in srgb,var(--tint) 12%,transparent);border-radius:999px;font-weight:600}
.toast.act{pointer-events:auto}.toast .tundo{border:0;background:none;color:var(--tint);font:inherit;font-weight:600;margin-left:8px;cursor:pointer}
.exr input.exin{border:0;background:none;font:inherit;font-size:15px;padding:3px 0;width:100%;color:var(--text);outline:none}
/* ===== 마감 다듬기: 애플 느낌 · 단정하게 ===== */
:root{--shadow:none;--r:14px}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{padding-left:18px;padding-right:18px}
.nav{min-height:30px}
.nav .sync{font-size:11px;color:var(--sub);opacity:.0;transition:opacity .3s}
.nav .sync.warn{opacity:1;color:var(--orange)}
.lt{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:0 0 2px}
.lsub{font-size:15px;margin-bottom:12px}
.lsub .dt{font-weight:600;letter-spacing:-.01em}
.grp,.stats,.banner,.ment,.dcal,.exsum,.exc,.wg,.dday,.fitcard{box-shadow:none!important}
.grp,.dcal,.exsum,.exc,.wg{border-radius:var(--r)}
.sec{margin-bottom:24px}
.sh{font-size:12.5px;font-weight:500;letter-spacing:.01em;padding:0 4px 7px}
.sf{padding:7px 4px 0;font-size:12.5px}
.rw{min-height:48px;padding:10px 16px}
.rw .tt{font-size:16.5px;letter-spacing:-.01em}
.stats{border-radius:var(--r);padding:14px 18px;gap:26px;margin-bottom:16px}
.stats div small{font-size:11.5px;letter-spacing:.01em}
.stats div b{font-size:22px;letter-spacing:-.02em}
.banner{border-radius:var(--r);padding:11px 14px;font-size:14.5px;line-height:1.4;margin-bottom:10px;align-items:center}
.banner .ic{width:20px;height:20px}
.ment{border-radius:var(--r);padding:13px 15px;font-size:14.5px;margin-bottom:12px;background:var(--card)!important;border-left:3px solid var(--green)}
.ment.night{border-left-color:var(--indigo)}
.ment .mbtns .ci{border-radius:999px}
.dday{background:var(--card)!important;border-radius:12px;padding:8px 14px}
.dday b{font-size:19px}
.dday.on{background:var(--red)!important}
.ddrow{margin:0 0 12px}
.wsd small{font-size:11px;letter-spacing:.02em}
.wsd b{font-weight:600;letter-spacing:-.02em}
.foot{margin:18px 0 6px;gap:10px}
.foot button{text-decoration:none;color:var(--sub);font-size:13px;font-weight:500;padding:6px 10px;border-radius:999px;background:var(--fill)}
.foot i{display:none}
.tabbar button{font-size:10px;letter-spacing:.01em}
.chipb{border-radius:999px}
.xbtn{opacity:.55}
.xbtn:hover,.xbtn:active{opacity:1}
.sheet{border-radius:16px 16px 0 0}
.sheet .shd b{font-size:16.5px;letter-spacing:-.01em}
.exc{border-left-width:3px}
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 14px}
.segc button{flex:1;border:0;background:none;border-radius:7px;padding:7px 0;font-size:14px;font-weight:600;color:var(--text);transition:background-color .2s}
.segc button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sjn{font-size:15px;color:var(--text);font-weight:700;margin-right:4px}
.hwr{align-items:flex-start}.hwr .cc{margin-top:2px}
.hwl{display:flex;align-items:center;gap:8px;min-width:0}
.hwl .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.hwd{flex:none;font-size:12px;font-weight:700;color:var(--sub);background:var(--fill);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.hwd.td{color:#fff;background:var(--red)}
.hwt{flex:none;border:0;background:none;color:var(--tint);font-size:13px;font-weight:600;padding:2px 0;font-variant-numeric:tabular-nums}
.grp .rw input.hwpart{display:block;width:100%;max-width:none;margin-top:6px;border:0;border-radius:8px;background:var(--fill);padding:7px 10px;font-size:14.5px;color:var(--text);outline:none;text-align:left}
.grp .rw input.hwpart:focus{background:color-mix(in srgb,var(--tint) 10%,var(--card));box-shadow:inset 0 0 0 1.5px var(--tint)}
.pastrow{opacity:.55}
.fsh{display:flex;align-items:baseline;justify-content:space-between;font-size:20px;font-weight:800;letter-spacing:-.02em;padding:6px 4px 10px}
.fsh span{font-size:12.5px;font-weight:500;color:var(--sub);letter-spacing:0}
.sec.fold{margin-bottom:10px}
.fh{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:11px 14px 11px 16px;border:0;background:none;text-align:left;color:var(--text);cursor:pointer}
.fh .mid{flex:1;min-width:0}
.fh .tt{font-size:16.5px;font-weight:700}
.fh .st{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh .fc{font-size:13px;font-weight:700;color:var(--sub);background:var(--fill);border-radius:99px;padding:3px 9px;font-variant-numeric:tabular-nums}
.fh .fc.all{color:#fff;background:var(--green,#34c759)}
.fh .fchv{display:flex;color:var(--sub);transition:transform .2s}
.fh .fchv svg{width:14px;height:14px}
.fold.open .fchv{transform:rotate(90deg)}
.fold .fb{border-top:.5px solid var(--sep,rgba(60,60,67,.18))}
.fold:not(.open) + .sec.fold{margin-top:0}
.brklink{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px auto 6px;border:0;background:none;color:var(--tint);font-size:13px;font-weight:600;padding:6px 10px;cursor:pointer}
.brklink span{color:var(--sub);font-weight:400;font-size:12px}
.lnkbtn{border:0;background:none;color:var(--tint);font-size:17px;padding:4px 6px;white-space:nowrap}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login .lg-box{width:100%;max-width:340px;text-align:center}
#login .lg-ic{width:76px;height:76px;margin:0 auto 18px;border-radius:18px;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center}
#login .lg-ic svg{width:46px;height:46px}
#login .lg-t{font-size:28px;font-weight:700;letter-spacing:.2px}
#login .lg-s{color:var(--sub);font-size:15px;margin:8px 0 28px;line-height:1.45}
#login .lg-btn{width:100%;border:0;border-radius:14px;background:var(--text);color:var(--bg);font-size:17px;font-weight:600;padding:15px}
/* 주 넘길 때 옆으로 밀기 */
@keyframes slL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.slL{animation:slL .34s cubic-bezier(.22,1,.36,1)}
.slR{animation:slR .34s cubic-bezier(.22,1,.36,1)}
@keyframes slOutL{to{opacity:0;transform:translateX(-18px)}}
@keyframes slOutR{to{opacity:0;transform:translateX(18px)}}
.slOutL{animation:slOutL .14s ease-in forwards}
.slOutR{animation:slOutR .14s ease-in forwards}
@keyframes tfL{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes tfR{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.tfL{animation:tfL .3s cubic-bezier(.22,1,.36,1)}
.tfR{animation:tfR .3s cubic-bezier(.22,1,.36,1)}
/* 날짜 줄 선택 동그라미: 따로 그려서 미끄러지게 */
.wstrip{position:relative}
.wsel{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--text);pointer-events:none;opacity:0;transition:left .36s cubic-bezier(.3,1.25,.4,1),top .36s,background-color .25s,opacity .2s}
.wsel.td{background:var(--red)}
.wsel.on{opacity:1}
.wsd b{position:relative;z-index:1;transition:color .25s}
.wstrip .wsd.sel b{background:none}
/* 펼칠 때 내용이 위에서 살짝 내려오며 나타나기 */
@keyframes openIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fold .fb,.exc .exitems{animation:openIn .28s cubic-bezier(.22,1,.36,1)}
#view.fade .fold .fb,#view.fade .exc .exitems{animation:none}
.sbody.slL,.sbody.slR{overflow-x:hidden}
.slL .cc.on,.slR .cc.on,.slL .bchk.on,.slR .bchk.on{animation:none}
/* 폰: 체크는 크게, 누르는 영역은 더 넓게, 옆 버튼과 떨어뜨리기 */
@media (pointer:coarse){
  .rw{min-height:54px}
  .cc{width:30px;height:30px}
  .cc svg{width:16px;height:16px}
  .cc,.bchk,.xbtn{position:relative}
  .cc::after{content:"";position:absolute;inset:-12px -10px -12px -14px}
  .bchk::after{content:"";position:absolute;inset:-10px}
  .ti .bchk{width:30px;height:30px}
  .xbtn{min-width:40px;min-height:40px;padding:8px;margin-right:-8px;display:grid;place-items:center}
  .rw .tmb{padding:7px 11px;margin-left:4px}
  .rw .tmb + .xbtn{margin-left:2px}
  /* 하루 시간표 안 할 일 체크 */
  /* 동그라미는 칸 안에 들어가게 조금만 키우고, 누르는 영역은 투명하게 넓힌다 */
  .dev .tk .o,.tk .o{width:17px;height:17px;position:relative;border-width:1.6px}
  .dev .tk .o svg,.tk .o svg{width:10px;height:10px}
  .dev .tk.slot .o{margin-top:0}
  .tk .o::after{content:"";position:absolute;inset:-8px -12px -10px -10px}
  .dev .bchk{width:20px;height:20px}
  .dev .bchk svg{width:11px;height:11px}
}
/* 지난 칸: 칸 색과 칸 이름만 흐리게, 안의 할 일 글씨는 그대로 (아직 안 했을 수도 있으니까) */
.dcal .dev.past{--c:var(--gray)!important}
.dcal .dev.past>.dtop,.dcal .dev.past>.dtime{opacity:.45}
.dcal .dev.rest.past{opacity:.45}
.dcal .tk.slot.past .st0{opacity:.5}
/* 컴퓨터: − 값 + 의 값을 눌러 직접 입력 */
html.desk .step span{cursor:text;border-radius:6px}
html.desk .step span:hover{background:var(--fill)}
.step input.stin{width:72px;border:0;background:var(--card);color:var(--text);text-align:center;font:inherit;font-size:14px;padding:4px 2px;border-radius:6px;outline:2px solid var(--tint)}
.dcal .tk.slot.meal{--c:var(--brown);background:color-mix(in srgb,var(--brown) 14%,var(--card))}
/* 끌어서 넣을 때: 들어갈 자리 줄 */
#insline{position:fixed;left:0;top:0;height:2.5px;border-radius:2px;background:var(--c,var(--tint));z-index:91;pointer-events:none;opacity:0;transition:transform .14s cubic-bezier(.2,.8,.2,1),opacity .15s,width .14s;box-shadow:0 0 0 1px color-mix(in srgb,var(--card) 70%,transparent)}
#insline.on{opacity:1}
#insline i{position:absolute;left:-6px;top:50%;width:9px;height:9px;margin-top:-6.5px;border-radius:50%;border:2.5px solid var(--c,var(--tint));background:var(--card)}
#insline span{position:absolute;right:0;bottom:5px;font-size:11px;font-weight:700;letter-spacing:-.1px;color:#fff;background:var(--c,var(--tint));padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
body.dragmode .dev .tk.slot{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.dev .tk.slot.shU{transform:translateY(-5px)}
.dev .tk.slot.shD{transform:translateY(7px)}
body.dragmode .dev.dropover{box-shadow:inset 0 0 0 1.5px var(--c)!important;background:color-mix(in srgb,var(--c) 16%,var(--card))!important}
.rw.msr{padding:0 8px 0 0;min-height:40px;gap:0}
.msr-a{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 8px 9px 16px;font-size:14.5px;min-width:0}
.msr-a svg{margin-left:auto;flex:none}
.msr-t{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13.5px;white-space:nowrap}
.msr-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msr-b{flex:none;border:0;background:var(--fill);color:var(--tint);font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px}
.msr-b.on{background:var(--tint);color:#fff}
html.desk .msr-a:hover{background:color-mix(in srgb,var(--fill) 60%,transparent)}
.jbrow{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.jbchip{border:0;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--text);font-size:12.5px;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.jbchip b{color:var(--c);font-weight:700;margin-right:2px}
.jbadd{border:0;background:none;color:var(--tint);font-size:12.5px;font-weight:600;padding:5px 4px}
/* 겹침 자세히 */
.trimwhy{padding:0 16px 14px;font-size:15px;line-height:1.5}
.trimwhy b{font-weight:600}
.tlv{background:var(--card);border-radius:12px;padding:14px 14px 8px;margin:0 0 14px}
.tlr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tll{flex:none;width:58px;font-size:11.5px;color:var(--sub);text-align:right}
.tlt{position:relative;flex:1;height:44px;background:var(--fill);border-radius:8px;overflow:hidden}
.tlb{position:absolute;top:3px;bottom:3px;border-radius:6px;background:color-mix(in srgb,var(--c) 26%,var(--card));border-left:3px solid var(--c);padding:3px 6px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-width:2px}
.tlb b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlb small{font-size:10.5px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.tlb.dim{opacity:.45}
.tlb.mine{background:color-mix(in srgb,var(--red) 16%,var(--card));border:1.5px dashed var(--red);border-left-width:3px;border-left-style:solid}
.tlo{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--red) 38%,transparent) 0 4px,transparent 4px 8px);pointer-events:none;border-left:1.5px solid var(--red);border-right:1.5px solid var(--red)}
.tlx{position:relative;height:18px;margin-left:68px}
.tlx span{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.tlx span i{display:block;width:1px;height:4px;background:var(--sep);margin:0 auto 2px}
/* 세로 미니 시간표 (겹침 자세히) */
.vtl{background:var(--card);border-radius:12px;padding:10px 12px 14px;margin:0 0 14px}
.vth{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;font-size:11.5px;color:var(--sub);margin-bottom:8px}
.vtb{position:relative;display:grid;grid-template-columns:44px 1fr 1fr;gap:8px}
.vtx{position:relative}
.vtx span{position:absolute;right:2px;transform:translateY(-50%);font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.vlane{position:relative;background:var(--fill);border-radius:8px}
.vb{position:absolute;left:3px;right:3px;border-radius:6px;background:color-mix(in srgb,var(--c) 24%,var(--card));border-left:3px solid var(--c);padding:4px 7px;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.vb b{font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb small{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.vb.one{flex-direction:row;align-items:center;gap:6px;padding:0 7px}
.vb.one b{font-size:12px}.vb.one small{font-size:10.5px}
.vb.tiny b,.vb.tiny small{display:none}
.vb.dim{opacity:.5}
.vb.mine{background:color-mix(in srgb,var(--red) 14%,var(--card));border:1.5px dashed var(--red);border-left:3px solid var(--red)}
.vo{position:absolute;left:52px;right:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--red) 26%,transparent) 0 3px,transparent 3px 9px);border-top:1.5px solid var(--red);border-bottom:1.5px solid var(--red);pointer-events:none;border-radius:2px}
/* 추가 창 미니 시간표 */
.mtl{position:relative;margin:0 0 6px;background:var(--card);border-radius:12px;padding:10px 12px 10px 0}
.mtl .mtb{position:absolute;left:58px;right:12px;border:0;text-align:left;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,var(--card));border-left:3px solid var(--c);padding:0 9px;display:flex;align-items:center;gap:8px;overflow:hidden;font-size:13px;color:var(--text)}
.mtl .mtb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtl .mtb small{margin-left:auto;color:var(--sub);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mtl .mtt{position:absolute;left:4px;width:48px;transform:translateY(-50%);border:0;background:none;color:var(--sub);font-size:11.5px;font-variant-numeric:tabular-nums;padding:3px 0;border-radius:999px;z-index:2}
.mtl .mtt.on{background:var(--tint);color:#fff;font-weight:700}
html.desk .mtl .mtt:hover{background:var(--fill);color:var(--text)}
.mtl .mtp{position:absolute;left:58px;right:12px;border:2px solid var(--tint);background:color-mix(in srgb,var(--tint) 22%,transparent);border-radius:7px;z-index:1;pointer-events:none;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;transition:top .2s cubic-bezier(.2,.8,.2,1),height .2s cubic-bezier(.2,.8,.2,1)}
.mtl .mtp span{font-size:11.5px;font-weight:700;color:#fff;background:var(--tint);border-radius:999px;padding:2px 8px;white-space:nowrap}
.jbday{background:var(--card);border-radius:12px;padding:10px 14px 6px;margin-bottom:12px;box-shadow:var(--shadow)}
.jbh{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:4px}
.jbl{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:.5px solid var(--sep)}
.jbl:first-of-type{border-top:0}
.jbn{flex:1;min-width:0;display:flex;flex-direction:column;border-left:3px solid var(--c);padding-left:8px}
.jbn b{font-size:14.5px;font-weight:600}
.jbn small{font-size:12px;color:var(--sub)}
.dcal .dev.free{background:transparent!important;border:1.5px dashed color-mix(in srgb,var(--sub) 55%,transparent);border-left-width:1.5px}
.dcal .dev.free .dtop b{color:var(--sub);font-weight:500}
.dcal .dev.free .dtop b::after{content:" · 눌러서 채우기";font-size:.85em;color:var(--tint)}
/* ===== 컴퓨터 화면 (html.desk) ===== */
html.desk body{padding-left:228px}
html.desk .wrap{padding:22px 32px 48px}
html.desk .wrap.two{max-width:1280px}
html.desk .wrap.wide{max-width:1320px}
@media (min-width:1900px){html.desk .wrap.two{max-width:1500px}html.desk .wrap.wide{max-width:1680px}html.desk .dcols{grid-template-columns:minmax(0,1.4fr) minmax(420px,1fr);gap:36px}}
html.desk .tabbar{left:0;top:0;right:auto;bottom:0;width:228px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:2px;padding:22px 12px 16px;border-top:0;border-right:.5px solid var(--sep);background:color-mix(in srgb,var(--card) 70%,var(--bg))}

<body>
<div class="wrap" id="wrap"><div id="view"></div></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="shd" id="shd"></div><div class="sbody" id="sbody"></div></div>
<div class="toast hide" id="toast"></div>
<script id="engine">
/* ===== 시간 계산 엔진 (화면과 분리) ===== */
const DAYS = ['일','월','화','수','목','금','토'];
const toMin = s => { if (!s) return null; const [h,m] = String(s).split(':').map(Number); return h*60 + (m||0); };
const fmt = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const dowOf = s => parseYmd(s).getDay();
const durTxt = m => { const h = Math.floor(m/60), r = m%60; return (h ? h + '시간' : '') + (r ? (h?' ':'') + r + '분' : (h ? '' : '0분')); };

const LEAVE = { full:1310, after2:1210, memo:1130, dinner:1130, after1:1060, none:960 };
const OVERLAY_KINDS = ['meal','rest','study','travel','free'];   /* free: 빈 시간 */
const YAJA_OPTS = [
  ['full','야자 다 함'], ['after2','야자2 끝나고 (20:10)'], ['dinner','석식 먹고 (18:50)'],
  ['after1','야자1 끝나고 (17:40)'], ['none','바로 귀가 (16:00)']
];
const SCHOOL_SEGS = [
  {s:980,  e:1060, label:'야자1', type:'study'},
  {s:1060, e:1130, label:'석식', type:'meal', dinner:true},
  {s:1130, e:1210, label:'야자2', type:'study'},
  {s:1210, e:1220, label:'쉬는 시간', type:'rest'},
  {s:1220, e:1310, label:'야자3', type:'study'}
];
const SCHOOL_TT = [['07:50','08:10','조회'],['08:10','09:00','1교시'],['09:00','09:10','쉬는 시간'],['09:10','10:00','2교시'],['10:00','10:10','쉬는 시간'],['10:10','11:00','3교시'],['11:00','11:10','쉬는 시간'],['11:10','12:00','4교시'],['12:00','13:10','점심'],['13:10','14:00','5교시'],['14:00','14:10','쉬는 시간'],['14:10','15:00','6교시'],['15:00','15:10','쉬는 시간'],['15:10','16:00','7교시']];
const PLACES = { school:'학교 앞', daechi:'대치', home:'집', other:'기타' };
const TAGS = { hw:'숙제', my:'내 공부', memo:'암기', review:'복습' };

function defaultSettings(){
  const all = [0,1,2,3,4,5,6];
  return {
    v:1,
    wakeWeekday:'06:30', wakeWeekend:'09:00', prepMin:40,
    sleep:['00:30','01:30','01:30','01:30','01:30','01:30','01:00'],
    schoolMin:10, schoolWalk:20, schoolTaxi:5, goMode:'bus', backMode:'walk', nearWalk:10, subwayMin:60, homeMin:20, busMin:60, taxiMin:30, washMin:20, studyLen:50, breakLen:10,
    defaultTransport:'bus', satGapDefault:'stay',
    yajaDefault:['full','full','full','full','full','full','full'],
    myTarget:[180,60,150,150,150,150,60],
    sunRestStart:'15:00', sunRestMin:120,
    weeklyCheckStart:'21:00', weeklyCheckMin:30,
    academies:[
      {id:'jp',  name:'일본어 학원', day:1, start:'18:30', end:'21:50', place:'school', travel:10, note:''},
      {id:'soc', name:'사회 학원',   day:6, start:'09:00', end:'11:50', place:'daechi', travel:0, note:''},
      {id:'eng', name:'영어 과외',   day:6, start:'12:00', end:'14:00', place:'daechi', travel:0, note:''},
      {id:'kor', name:'국어 학원',   day:6, start:'18:30', end:'21:30', place:'daechi', travel:0, note:'늦게 끝나는 날 많음 · 재시 날은 18:00'}
    ],
    flex:[ {id:'math', name:'수학 과외', perWeek:2, place:'home', start:'19:00', end:'21:00'} ],
    subjects:[ {name:'국어', color:'#ff9500'}, {name:'영어', color:'#007aff'}, {name:'수학', color:'#34c759'}, {name:'사회', color:'#af52de'}, {name:'일본어', color:'#ff2d55'}, {name:'기타', color:'#8e8e93'} ],
    myRoutine:[ {id:'eng', text:'영어 끊어읽기 지문 2개', min:120}, {id:'kor', text:'국어 매3비 1일차', min:null} ],
    daily:[
      {id:'w1', text:'영어 단어 앱 100개', days:all.slice(), split:2},
      {id:'tr', text:'영어 해석해서 선생님께 보내기', days:all.slice()}
    ]
  };
}

/* 이동 수단: 걷기 · 버스 · 지하철 · 택시 */
const MODE_L = { walk:'걸어서', bus:'버스', subway:'지하철', taxi:'택시' };
const modeTag = m => ' (' + (MODE_L[m] || '버스') + ')';
const schoolModeMin = (S, m) => m === 'walk' ? (+S.schoolWalk || 20) : m === 'taxi' ? (+S.schoolTaxi || 5) : (+S.schoolMin || 10);
function travelTo(S, place, ev, transport){
  if (place === 'school') return +S.schoolMin || 0;
  if (place === 'daechi') return transport === 'taxi' ? (+S.taxiMin||0) : transport === 'subway' ? (+S.subwayMin || +S.busMin || 0) : (+S.busMin||0);
  if (place === 'home') return 0;
  return +(ev && ev.travel) || 0;
}
/* 집으로 가는 길: 학교(학교 앞 학원 포함) → 집은 따로 정한 시간(기본 20분) */
function travelHome(S, from, fromEv, transport){ return from === 'school' ? (+S.homeMin || 20) : travelTo(S, from, fromEv, transport); }
function travelBetween(S, from, to, ev, fromEv, transport){
  if (from === to) return 0;
  if (to === 'school' && from !== 'home' && from !== 'daechi') return +S.nearWalk || 10;   /* 학교 근처(시험 끝나고 학교 앞 학원 등)는 걸어서 */
  if (from === 'home') return travelTo(S, to, ev, transport);
  if (to === 'home') return travelHome(S, from, fromEv, transport);
  return Math.max(travelTo(S, to, ev, transport), 10);
}
function placeLabel(place, ev){ return place === 'other' ? ((ev && ev.placeName) || '기타') : PLACES[place] || place; }

/* 그날 들어가는 학원·일정 (고정 + 오늘만 바꾼 것 반영) */
function dayEvents(S, date, D){
  const dow = dowOf(date); D = D || {};
  const ov = D.acad || {};
  const list = [];
  for (const a of (S.academies||[])){
    if (a.day !== dow || !a.start || !a.end) continue;
    const o = ov[a.id] || {};
    const trv = o.travel != null ? o.travel : a.travel;
    list.push({ id:a.id, name:a.name, place:a.place === 'home' && +trv ? 'other' : a.place, travel:trv, travelChanged:o.travel != null || !!o.go || !!o.leave || o.travelBack != null, go:o.go || null, leave:o.leave || null, travelBack:o.travelBack != null ? o.travelBack : null, placeName:a.placeName || (a.place === 'home' && +trv ? a.name : undefined), note:a.note,
      start:o.start || a.start, end:o.end || a.end, skip:!!o.skip, movedTo:o.movedTo || null,
      changed:!!(o.start || o.end), fixed:true });
  }
  for (const x of (D.extra||[])){
    if (OVERLAY_KINDS.includes(x.kind)) continue;
    list.push({ id:x.id, name:x.name, place:(x.place === 'home' && +x.travel) ? 'other' : (x.place||'other'), travel:x.travel, go:x.go || null, leave:x.leave || null, travelBack:x.travelBack != null ? x.travelBack : null, travelChanged:!!x.go || !!x.leave || x.travelBack != null, placeName:x.placeName || ((x.place === 'home' && +x.travel) ? x.name : undefined),
      start:x.start||'', end:x.end||'', skip:false, extra:true, movedFrom:x.movedFrom||null, note:x.note||'', flex:x.flex||null, tbd:!(x.start && x.end) });
  }
  list.sort((a,b) => (toMin(a.start) ?? 9999) - (toMin(b.start) ?? 9999));
  return list;
}

const goOf = A => A && A.ev && A.ev.go ? clockMin(A.ev.go) : null;
const leaveOf = ev => ev && ev.leave ? clockMin(ev.leave) : null;
const backTr = (ev, def) => ev && ev.travelBack != null ? +ev.travelBack : def;
const evKey = ev => ev ? (ev.extra ? 'x:' + ev.id : ev.id) : null;
function buildDay(S, date, D){
  D = D || {};
  /* 집 ↔ 학교: 그날 고른 수단(없으면 기본: 등교 버스, 하교 걷기)으로 시간 계산 */
  S = Object.assign({}, S, { schoolMin: schoolModeMin(S, D.goMode || S.goMode || 'bus'), homeMin: schoolModeMin(S, D.backMode || S.backMode || 'walk'), schoolBus: +S.schoolMin || 10 });
  const dow = dowOf(date);
  const transport = D.transport || S.defaultTransport || 'bus';
  const gapMode = D.gap || S.satGapDefault || 'stay';
  const isSchool = dow >= 1 && dow <= 5 && !D.noSchool;
  const events = dayEvents(S, date, D).filter(e => !e.skip && e.start && e.end);
  const warnings = [];
  let sleep = toMin(D.sleep || S.sleep[dow] || '01:30'); if (sleep < 720) sleep += 1440;

  // 기준점(학교·학원) 만들기
  const anchors = [];
  let yaja = D.yaja || (S.yajaDefault && S.yajaDefault[dow]) || 'full';
  if (isSchool){
    let leave = LEAVE[yaja] ?? 1310;
    const after = events.filter(e => toMin(e.end) > 960);
    if (after.length){
      const a = after[0];
      const lim = toMin(a.start) - travelBetween(S, 'school', a.place, a, null, transport);
      if (lim < leave){ leave = Math.max(960, lim); }
    }
    const segs = [{s:470, e:960, label:'학교 수업', type:'school', key:'seg:학교 수업'}];
    if (leave > 960){
      segs.push({s:960, e:Math.min(980, leave), label:'휴식 · 간식', type:'rest', key:'seg:휴식 · 간식'});
      for (const g of SCHOOL_SEGS){
        if (g.s >= leave) break;
        const e = Math.min(g.e, leave);
        if (e - g.s < 15 && g.type !== 'rest') continue;
        segs.push({...g, e, key:'seg:' + g.label});
      }
    }
    anchors.push({ kind:'school', place:'school', s:470, e:segs[segs.length-1].e, segs, leave });
  }
  for (const ev of events){
    anchors.push({ kind:'acad', place:ev.place, s:toMin(ev.start), e:toMin(ev.end), ev });
  }
  anchors.sort((a,b) => a.s - b.s);

  const ctx = { lunchDone:true, dinnerDone:true, dow, S, blocks:[] }; /* 점심·저녁은 자동으로 넣지 않음 — 직접 추가 */
  const push = b => { if (b.e - b.s > 0){ if (!b.key){ if (b.type === 'travel' && b.tev){ const k0 = 'tr:' + b.tev + (/^귀가|집으로|→ 집/.test(b.label) ? ':b' : ':t'); b.key = ctx.blocks.some(x => x.key === k0) ? k0 + ':' + b.s : k0; } else b.key = (b.type === 'travel' ? 'tr:' : 'b:') + b.s; } ctx.blocks.push(b); } };

  // 기상
  let wake;
  if (isSchool) wake = toMin(S.wakeWeekday);
  else if (anchors.length && anchors[0].s < 840){
    const f = anchors[0];
    wake = (goOf(f) != null ? goOf(f) : f.s - travelTo(S, f.place, f.ev, transport)) - (+S.prepMin||40);
  } else wake = toMin(S.wakeWeekend);
  if (D.wake) wake = toMin(D.wake);

  let t = wake, loc = 'home', locEv = null;
  const firstDep = anchors.length ? (goOf(anchors[0]) != null ? goOf(anchors[0]) : anchors[0].s - travelBetween(S, 'home', anchors[0].place, anchors[0].ev, null, transport)) : sleep;
  if (firstDep - wake <= 100){ push({s:wake, e:firstDep, label:'기상 · 준비 · 아침', type:'wake', key:'wake'}); t = firstDep; }
  else { push({s:wake, e:wake+40, label:'기상 · 아침', type:'wake', key:'wake'}); t = wake + 40; }

  for (let i = 0; i < anchors.length; i++){
    const A = anchors[i];
    const tr = travelBetween(S, loc, A.place, A.ev, locEv, transport);
    if (A.s < t){ warnings.push((A.ev ? A.ev.name : '학교') + ' 시간이 앞 일정과 겹칩니다'); }
    if (loc === 'home' && goOf(A) != null && tr > 0 && A.kind !== 'school'){
      const g0 = goOf(A);
      fillFree(ctx, 'home', t, g0, { beforeAnchor:true });
      push({ s:g0, e:g0 + tr, label:'이동 → ' + placeLabel(A.place, A.ev), type:'travel', tev:evKey(A.ev), tplace:A.place });
      if (g0 + tr < A.s) fillFree(ctx, 'away', g0 + tr, A.s, { beforeAnchor:true, place:placeLabel(A.place, A.ev) });
    } else if (loc === 'home'){
      fillFree(ctx, 'home', t, A.s - tr, { beforeAnchor:true });
      if (tr > 0) push({ s:A.s - tr, e:A.s, label: A.kind === 'school' ? '등교' : '이동 → ' + placeLabel(A.place, A.ev) + (A.place === 'daechi' ? modeTag(transport) : ''), type:'travel', tev:(A.ev ? (A.ev.extra ? 'x:' + A.ev.id : A.ev.id) : null), tplace:A.place });
    } else if (loc === A.place && loc === 'school' && A.kind !== 'school'){
      /* 학교 → 학교 앞 학원: 언제나 걸어서 */
      const w = Math.min(+S.nearWalk || 10, Math.max(0, A.s - t));
      if (A.s - w > t) fillFree(ctx, 'away', t, A.s - w, { beforeAnchor:true, place:placeLabel(loc, locEv) });
      if (w > 0) push({ s:A.s - w, e:A.s, label:'이동 → 학교 앞 (걸어서)', type:'travel', tev:evKey(A.ev), tplace:'school' });
    } else if (loc === A.place){
      let gap = A.s - t;
      const trHome = travelTo(S, loc, locEv, transport);
      if (gap > 0 && gapMode === 'home' && loc !== 'school' && gap >= 2*trHome + 60){
        if (!ctx.lunchDone && t >= 690 && t <= 870){ push({s:t, e:t+40, label:'점심', type:'meal', key:'lunch'}); ctx.lunchDone = true; t += 40; }
        push({ s:t, e:t+trHome, label:'집으로 이동' + modeTag(transport), type:'travel', tplace:'daechi' });
        fillFree(ctx, 'home', t + trHome, A.s - trHome, { beforeAnchor:true });
        push({ s:A.s - trHome, e:A.s, label:'이동 → ' + placeLabel(A.place, A.ev) + modeTag(transport), type:'travel', tplace:'daechi' });
      } else if (gap > 0 && gap <= 15){
        push({ s:t, e:A.s, label:'이동', type:'travel' });
      } else if (gap > 0){
        fillFree(ctx, 'away', t, A.s, { beforeAnchor:true, place:placeLabel(loc, locEv) });
      }
    } else if (A.place === 'home' && (leaveOf(locEv) != null || (locEv && locEv.travelBack != null))){
      const trB = backTr(locEv, tr), L = leaveOf(locEv) != null ? Math.max(t, leaveOf(locEv)) : A.s - trB;
      fillFree(ctx, 'away', t, L, { beforeAnchor:true, place:placeLabel(loc, locEv) });
      push({ s:L, e:L + trB, label:'이동 → 집', type:'travel', tev:evKey(locEv), tplace:loc });
      if (L + trB < A.s) fillFree(ctx, 'home', L + trB, A.s, { beforeAnchor:true });
    } else {
      fillFree(ctx, 'away', t, A.s - tr, { beforeAnchor:true, place:placeLabel(loc, locEv) });
      push({ s:A.s - tr, e:A.s, label:'이동 → ' + placeLabel(A.place, A.ev), type:'travel', tev:(A.place === 'home' || A.place === 'daechi' || A.place === 'school') && locEv ? (locEv.extra ? 'x:' + locEv.id : locEv.id) : (A.ev ? (A.ev.extra ? 'x:' + A.ev.id : A.ev.id) : null), tplace:A.place === 'home' ? loc : A.place });
    }
    if (A.kind === 'school'){
      for (const g of A.segs){ push({...g}); if (g.dinner) ctx.dinnerDone = true; }
    } else {
      push({ s:A.s, e:A.e, label:A.ev.name, type:'acad', ev:A.ev, key:'ev:' + A.ev.id });
    }
    t = Math.max(t, A.e); loc = A.place; locEv = A.ev || null;
  }
  if (loc !== 'home'){
    const tb = D.transportBack || transport;   /* 올 때는 따로 (갈 땐 버스, 올 땐 택시 등) */
    const tr = backTr(locEv, travelHome(S, loc, locEv, tb)), L = leaveOf(locEv);
    if (L != null && L > t){ fillFree(ctx, 'away', t, L, { place:placeLabel(loc, locEv) }); t = L; }
    /* 귀가는 마음대로 넣지 않고 물어본다(시간표에 '+ 귀가' 버튼). 교회처럼 오가는 시간을 정해 둔 곳만 자동으로 넣는다. */
    const fixedBack = loc === 'other' || (locEv && locEv.travelBack != null);
    if (fixedBack){ push({ s:t, e:t+tr, label:'귀가' + (loc === 'daechi' ? modeTag(tb) : ''), type:'travel', tev:locEv ? (locEv.extra ? 'x:' + locEv.id : locEv.id) : null, tplace:loc }); t += tr; }
    else if (tr > 0) ctx.askHome = { s:t, n:tr, from:loc, label:'귀가' + (loc === 'daechi' ? modeTag(tb) : ''), alt: loc === 'daechi' && !(locEv && locEv.travelBack != null) ? { bus:+S.busMin || 60, taxi:+S.taxiMin || 30 } : null };
  }
  if (t >= sleep - 20) warnings.push('집에 오면 바로 잘 시간입니다');
  fillFree(ctx, 'home', t, sleep, { final:true });
  ctx.blocks.sort((a,b) => a.s - b.s);
  ctx.blocks = applyOverlays(ctx.blocks, D, wake, sleep, isSchool);
  if (D.lbl) for (const b of ctx.blocks) if (b.key && D.lbl[b.key]){ b.label = D.lbl[b.key]; b.renamed = true; }
  const trims = ctx.blocks.trims || [];
  ctx.blocks.push({ s:sleep, e:sleep, label:'취침', type:'wake', marker:true, key:'sleep' });

  // 공부 칸에 숙제/내 공부 붙이기

  const from = date === today() ? (new Date().getHours() * 60 + new Date().getMinutes() + (new Date().getHours() < 6 ? 1440 : 0)) : 0;
  const open = study.filter(b => b.e > from + 10);
  const todo = P.tasks.filter(t => !t.done && !P.map[t.tk]).sort((a, b) => (a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : b.min - a.min);

    if (t.vocab){ const m = open.filter(b => b.type === 'memo' || /단어/.test(b.label)); if (m.length) pool = m.concat(open); }
    let b = pool.find(x => cap[x.key] >= t.min);

    if (b){ sug[t.tk] = b.key; cap[b.key] -= t.min; } else sug[t.tk] = null;

const ANIM_CLS = new Set(['slL', 'slR', 'slOutL', 'slOutR', 'tfL', 'tfR', 'fade']);

function patchKids(a, b){

function patchNode(x, y){

  /* 움직이는 중인 표시(옆으로 밀기 등)는 다시 그려도 지우지 않는다. 안 그러면 데이터가 도착할 때 움직임이 끊긴다 */

  for (const at of Array.from(x.attributes)) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);

  if (x.tagName !== 'TEXTAREA') patchKids(x, y);

    if (x.tagName === 'TEXTAREA'){ if (x.value !== y.textContent) x.value = y.textContent; }

/* 이동이 없는 곳 찾기: 학교·학원이 끝나고 집으로 가야 하는데 이동 칸이 없으면 물어본다.

    out.push({ s:a.e, n:travelBetween(S, pl, 'home', null, a.ev || null, R.transport) || 10, label:'이동', fp:pl, from:a.label });

function simplifyBlocks(blocks, opt){

    const d = b0.e - b0.s;
    if (b0.type === 'rest' && !rests && d < 60 && !(b0.custom && !String(b0.key).startsWith('gap:'))) continue;
    if (b0.key === 'wash' && !rests) continue;
    if (b0.type === 'rest' && d < 5) continue;
    if (b0.type === 'travel' && d < 5) continue;   /* 10분짜리 이동(학교 → 학원, 학원 → 집)도 보인다 */
    if (b0.type === 'check' && d <= 10) continue;
    const b = { ...b0, members:[b0.s] };
    if (b.type === 'wake') b.label = '기상 · 준비';
    const last = out[out.length - 1];
    if (last && b.type === 'free' && last.type === 'free' && b.s === last.e){ last.e = b.e; last.members.push(b.s); continue; }
    if (last && b.type === 'study' && last.type === 'study' && !b.fixedTag && !last.fixedTag && /^g:/.test(b.key || '') && /^g:/.test(last.key || '') && last.label === b.label && b.s === last.e){ last.e = b.e; last.members.push(b.s); continue; }
    out.push(b);
  }
  return out;
}

function shortLabel(b){
  const L = b.label;
  if (b.renamed) return L;
  if (b.type === 'wake') return '기상';
  if (b.type === 'school') return '학교';
  if (b.type === 'travel') return L.startsWith('귀가') ? '귀가' : L.startsWith('집으로') ? '집으로' : '이동';
  if (b.type === 'memo') return '단어 암기';
  if (b.type === 'review') return '복습';
  if (b.type === 'check') return '주간 점검';
  if (b.type === 'rest') return L === '자유 시간' ? '자유' : L;
  if (b.type === 'study'){ if (/^야자/.test(L)) return L; if (L.startsWith('자습')) return '자습'; if (L === '집 공부') return '공부'; return L; }
  return L;
}
function weekData(ws){
  const days = [];
  let lo = 24*60, hi = 0;
  for (let i = 0; i < 7; i++){
    const d = addDays(ws, i), R = buildDay(S, d, getDay(d)), B = simplifyBlocks(R.blocks);
    if (B.length){ lo = Math.min(lo, B[0].s); hi = Math.max(hi, R.sleep); }
    const T = {};
    if (B.length){ const P = planFor(d, B), F = dayFlow(d, B, P); for (const k in F) if (F[k].length) T[k] = F[k]; }
    days.push({ d, R, B, T });
  }
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
  return { days, lo, hi, n:(hi - lo) / 10 };
}
/* 하루 전체: 칸마다 할 일을 시간 순서로 넣고, 넘치면 다음 공부 칸으로 이어서 */
function dayFlow(date, blocks, P){
  const ord = getDay(date).ord || {}, fixAt = getDay(date).at || {}, idx = new Map(P.tasks.map((t, i) => [t.tk, i]));
  const rk = t => ord[t.tk] != null ? ord[t.tk] : 1000 + idx.get(t.tk);
  const candK = new Set(P.cand.map(c => c.key));
  const res = {};
  for (const b of blocks) if (b.type === 'school' && candK.has(b.key)) res[b.key] = P.tasks.filter(t => P.map[t.tk] === b.key).sort((a, c) => rk(a) - rk(c)).map(t => ({ t, s:b.s, e:b.s, school:true }));
  const recv = blocks.filter(b => b.type !== 'rest' && b.type !== 'school' && candK.has(b.key));
  let carry = [];
  recv.forEach((b, bi) => {
    const own = P.tasks.filter(t => P.map[t.tk] === b.key).sort((a, c) => rk(a) - rk(c)).map(t => ({ t, left:t.min, cont:false }));
    const isTr = b.type === 'travel';
    const last = !recv.slice(bi + 1).some(x => x.type !== 'travel');
    const q = isTr ? own : carry.concat(own);
    const items = [], rest = []; let c = b.s;
    for (let k = 0; k < q.length; k++){
      const x = q[k], fx = fixAt[x.t.tk];
      if (fx != null && !x.cont && fx > c && fx < b.e) c = fx;
      const room = b.e - c;
      if (last || isTr || room >= x.left || (room >= 15 && x.left - room < 15)){ items.push({ t:x.t, s:c, e:c + x.left, cont:x.cont, over:c + x.left > b.e, out:c >= b.e, be:b.e }); c += x.left; continue; }
      if (room >= 15 && x.left - room >= 15){ items.push({ t:x.t, s:c, e:b.e, cont:x.cont, cut:true }); rest.push({ t:x.t, left:x.left - room, cont:true }); c = b.e; }
      else rest.push(x);
      for (let j = k + 1; j < q.length; j++) rest.push(q[j]);
      break;
    }
    if (!isTr) carry = rest;
    res[b.key] = items;
  });
  return res;
}
function dayOver(F){ let m = 0; for (const k in F) for (const it of F[k]) if (it.over) m = Math.max(m, it.e - it.be); return m; }
/* 칸 안의 할 일을 순서대로 시간에 나눠 넣기 */
function blockPlan(date, b, P){
  const ord = getDay(date).ord || {};
  const ts = P.tasks.map((t, i) => ({ t, i })).filter(x => P.map[x.t.tk] === b.key);
  ts.sort((a, c) => (ord[a.t.tk] != null ? ord[a.t.tk] : 1000 + a.i) - (ord[c.t.tk] != null ? ord[c.t.tk] : 1000 + c.i));

  return ts.map(({ t }) => { const s = c, e = c + (t.min || 30); c = e; return { t, s, e, over: e > b.e, out: s >= b.e }; });
}

  setDay(d, D => {
    const was = buildDay(S, d, D).isSchool ? (LEAVE[D.yaja || S.yajaDefault[dowOf(d)]] || 960) : 960;

      const a = clockMin(x.start), z = clockMin(x.end);

/* 추가 창의 작은 하루 시간표: 칸을 누르면 그 칸 시작, 왼쪽 시각을 누르면 그 시각부터. 넣을 자리를 파란 칸으로 미리 보여 준다 */
function miniTL(date, f){
  const L = simplifyBlocks(buildDay(S, date, getDay(date)).blocks, { rests:true }).filter(x => x.e > x.s);
  if (!L.length) return '';
  const segs = []; let y = 4, t = L[0].s;
  for (const b of L){ if (b.s > t){ const h = Math.min(14, (b.s - t) * .4); segs.push({ s:t, e:b.s, y, h }); y += h; }
    const h = Math.max(26, Math.min(64, Math.round((b.e - b.s) * .42))); segs.push({ s:b.s, e:b.e, y, h, b }); y += h; t = Math.max(t, b.e); }
  const yOf = m => { if (m <= segs[0].s) return segs[0].y; for (const sg of segs) if (m >= sg.s && m <= sg.e) return sg.y + sg.h * (m - sg.s) / Math.max(1, sg.e - sg.s); return y; };
  const sM = clockMinUI(f.start), eM = clockMinUI(f.end);
  let h = '';
  for (const sg of segs) if (sg.b){ const b = sg.b; h += `<button class="mtb" data-act="addat" data-v="${b.s}" style="top:${sg.y + 1.5}px;height:${sg.h - 3}px;--c:${colorOf(b)}"><b>${esc(b.label)}</b><small>${fmt(b.s)}–${fmt(b.e)}</small></button>`; }
  const ts = [...new Set(L.map(b => b.s).concat(L.map(b => b.e)))].sort((a, z) => a - z); let last = -99;
  for (const m of ts){ const yy = yOf(m); if (yy - last < 15 && m !== sM) continue; last = yy; h += `<button class="mtt ${m === sM ? 'on' : ''}" data-act="addat" data-v="${m}" style="top:${yy}px">${fmt(m)}</button>`; }
  if (eM > sM){ const y1 = yOf(sM), y2 = yOf(eM), nm = (f.name || '').trim() || ({ meal:'식사', rest:'쉬기', study:'공부', travel:'이동', event:'일정', jikbo:'직보' })[f.kind] || '';
    h += `<div class="mtp" style="top:${y1}px;height:${Math.max(8, y2 - y1)}px"><span>${esc(nm)} ${fmt(sM)}–${fmt(eM)}</span></div>`; }
  return `<div class="mtl" style="height:${y + 8}px">${h}</div>`;
}
