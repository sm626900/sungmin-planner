/* ===== 동작 ===== */
function ensureWeek(ws){ for (let i = 0; i < 7; i++){ const d = addDays(ws, i), p = 'days/' + d; if (!subs[p]) sub(p, data => { if (running[p] || pend[p]) return; DAYDOC[d] = data ? clone(data) : {}; render(); }); } }
function findEv(date, key){ return dayEvents(S, date, getDay(date)).find(e => (e.extra ? 'x:' + e.id : e.id) === key); }
function evApply(date, key, fn){
  setDay(date, D => {
    if (key.startsWith('x:')){ const x = (D.extra||[]).find(e => e.id === key.slice(2)); if (x) fn(x); }
    else { D.acad = D.acad || {}; D.acad[key] = D.acad[key] || {}; fn(D.acad[key]); if (!Object.keys(D.acad[key]).length) delete D.acad[key]; }
  });
}
function updPart(hid, pi, fn){ const h = HW.items.find(x => x.id === hid); if (!h) return; const p = h.parts.find(x => x.i === pi); if (!p) return; fn(p); saveHW(); }
function readNew(){ const f = sheet && sheet.form; if (!f) return; const g = id => document.getElementById(id); if (g('na-name')) f.name = g('na-name').value; if (g('na-s')) f.start = g('na-s').value; if (g('na-e')) f.end = g('na-e').value; if (g('na-p')) f.place = g('na-p').value; if (g('na-day')) f.day = +g('na-day').value; }
function readAdd(){ const f = sheet && sheet.form; if (!f) return; const g = id => document.getElementById(id); if (g('ad-name')) f.name = g('ad-name').value; if (g('ad-s')) f.start = g('ad-s').value; if (g('ad-e')) f.end = g('ad-e').value; if (g('ad-p')) f.place = g('ad-p').value; }
const clockMinUI = s => { let m = toMin(s); if (m < 360) m += 1440; return m; };
function readHF(){ const f = sheet && sheet.form; const a = document.getElementById('hf-title'); if (f && a) f.title = a.value; if (f) readRanges(f, 'hf'); }
function moveTaskQuiet(from, tk, to){
  if (tk.startsWith('h:')){ const [, hid, pi] = tk.split(':'); const h = HW.items.find(x => x.id === hid); const p = h && h.parts.find(x => x.i === +pi); if (p) p.date = to; save('planner/homework', HW); }
  else if (tk.startsWith('t:')){ const id = tk.slice(2), x = (getDay(from).todos || []).find(y => y.id === id); if (!x) return;
    setDay(from, D => { D.todos = (D.todos || []).filter(y => y.id !== id); });
    setDay(to, D => { D.todos = D.todos || []; D.todos.push({ ...x, done:false }); }); }
  setDay(from, D => { if (D.plan) delete D.plan[tk]; });
}
function setTaskMin(date, tk, min){
  if (tk.startsWith('h:')){ const [, hid, pi] = tk.split(':'); updPart(hid, +pi, p => { p.min = min; }); setDay(date, D => { if (D.mins) delete D.mins[tk]; }); return; }
  if (tk.startsWith('t:')){ const id = tk.slice(2); setDay(date, D => { const x = (D.todos || []).find(y => y.id === id); if (x) x.min = min; if (D.mins) delete D.mins[tk]; }); return; }
  setDay(date, D => { D.mins = D.mins || {}; D.mins[tk] = min; });
}
function moveTask(from, tk, to, blockKey){
  if (tk.startsWith('h:')){ const [, hid, pi] = tk.split(':'); updPart(hid, +pi, p => { p.date = to; }); }
  else if (tk.startsWith('t:')){ const id = tk.slice(2), x = (getDay(from).todos || []).find(y => y.id === id); if (!x) return;
    setDay(from, D => { D.todos = (D.todos || []).filter(y => y.id !== id); if (D.plan) delete D.plan[tk]; });
    setDay(to, D => { D.todos = D.todos || []; D.todos.push({ ...x, done:false }); }); ensureDays(); }
  else return;
  setDay(from, D => { if (D.plan) delete D.plan[tk]; });
  if (blockKey) setDay(to, D => { D.plan = D.plan || {}; D.plan[tk] = blockKey; });
  sheet = null; render(); toast(shortDate(to) + '로 옮겼습니다');
}
function addTodo(v, cat){ setDay(cur, D => { D.todos = D.todos || []; D.todos.push({ id:uid(), text:v, done:false, cat: cat || 'hw' }); }); }
function addDaily(v){ S.daily.push({ id:uid(), text:v, days:[0,1,2,3,4,5,6] }); saveS(); }

document.addEventListener('click', e => {
  render.hold = 0;   /* 사용자가 누른 건 바로 그린다 */
  if (e.target === $('#scrim')){ sheet = null; delArm = null; render(); return; }
  const tb = e.target.closest('#tabbar button[data-tab]');
  if (tb){ tab = tb.dataset.tab; delArm = null; sheet = null; render(); window.scrollTo({ top:0, behavior:'smooth' }); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
  if (document.activeElement && document.activeElement !== t && document.activeElement.blur) document.activeElement.blur();
  const a = t.dataset.act, v = t.dataset.v, d = t.dataset.d;
  if (!['hwdel','wdel','dailydel','fxdel','subjdel','dddel','tploff'].includes(a)) delArm = null;
  switch (a){
    case 'tab': tab = t.dataset.tab; render(); return;
    case 'day': goDay(+t.dataset.n); return;
    case 'open': { const was = tab === 'today' ? cur : null; cur = d; weekStart = weekStartOf(cur); tab = 'today'; sheet = null; ensureDays(); render(); if (was && was !== d) slideIn(d > was ? 1 : -1, weekStart !== weekStartOf(was)); else window.scrollTo(0,0); return; }
    case 'gotoday': { const was = cur; cur = today(); weekStart = weekStartOf(cur); ensureDays(); render(); if (was !== cur) slideIn(cur > was ? 1 : -1, weekStartOf(was) !== weekStart); return; }
    case 'wk': { const n = +t.dataset.n; swapWeek(n, true, () => { weekStart = addDays(weekStart, n); ensureDays(); render(); }); return; }
    case 'thisweek': { const n = weekStartOf(today()) < weekStart ? -1 : 1; swapWeek(n, true, () => { weekStart = weekStartOf(today()); ensureDays(); render(); }); return; }
    case 'openday': ensureDays(); openSheet({ type:'day', date:d }); return;
    case 'openweekly': openSheet({ type:'weekly', prev: sheet && sheet.type !== 'weekly' ? sheet : null }); return;
    case 'opentimes': openSheet({ type:'times' }); return;
    case 'sheetclose': sheet = null; render(); return;
    case 'sheetsave': sheetSave(); return;
    case 'bcxtr': { const f = t.dataset.f; setDay(d, D => { const x = (D.extra||[]).find(y => 'cx:' + y.id === t.dataset.k); if (x) trApply(x, f, v); }); return; }
    case 'addtrp': { readAdd(); trApply(sheet.form, t.dataset.f, v); render(); return; }
    case 'noask': { const a = +t.dataset.s; setDay(d, D => { D.noAsk = Object.assign({}, D.noAsk, { [a]:true }); }); toast('이 날은 묻지 않습니다'); return; }
    case 'addtr': { const a = +t.dataset.s, n = +t.dataset.n, nm = t.dataset.mode ? '귀가' + modeTag(t.dataset.mode) : (t.dataset.l || '이동').replace(/ 넣기$/, ''); const fr = t.dataset.from, md = t.dataset.mode || undefined; setDay(d, D => { D.extra = D.extra || []; D.extra.push({ id:uid(), name:nm, start:fmt(a), end:fmt(a + n), kind:'travel', place:'here', ...(fr ? { from:fr, to:'home', mode:md } : {}) }); }); toast(fmt(a) + '–' + fmt(a + n) + ' ' + nm + ' 넣었습니다'); return; }
    case 'delask': openSheet({ type:'fill', date:d, key:t.dataset.k, prev:null }); return;
    case 'fillgo': fillGo(sheet, v); return;
    case 'opentrim': openSheet({ type:'trim', date:d, i:+t.dataset.i }); return;
    case 'sheetcancel': sheetCancel(); return;
    case 'sheetback': if (sheet && sheet.prev){ sheet = sheet.prev; renderSheet.back = true; render(); } return;
    case 'undo': undoChange(d, t.dataset.k); toast('되돌렸습니다'); return;
    case 'yaja': {
      if (v === 'noschool'){ setDay(d, D => { D.noSchool = true; delete D.yaja; }); return; }
      setYaja(d, v); return; }
    case 'transb': setDay(d, D => { const cur0 = D.transportBack || D.transport || S.defaultTransport; D.transportBack = cur0 === 'taxi' ? 'bus' : 'taxi'; }); return;
    case 'trans': setDay(d, D => { const nv = (D.transport || S.defaultTransport) === 'taxi' ? 'bus' : 'taxi'; if (nv === S.defaultTransport) delete D.transport; else D.transport = nv; }); return;
    case 'gap': setDay(d, D => { const nv = (D.gap || S.satGapDefault) === 'home' ? 'stay' : 'home'; if (nv === S.satGapDefault) delete D.gap; else D.gap = nv; }); return;
    case 'openacad': ensureDays(); openSheet({ type:'acad', key:t.dataset.k, date:d || null, prev:sheet }); return;
    case 'newacad': openSheet({ type:'acad', isNew:true, date:d || null, prev:sheet }); return;
    case 'askip': { const o = ((getDay(d).acad||{})[t.dataset.k]) || {}; if (o.skip) undoChange(d, 'acad:' + t.dataset.k); else evApply(d, t.dataset.k, x => { x.skip = true; }); return; }
    case 'areset': evApply(d, t.dataset.k, x => { delete x.start; delete x.end; }); return;
    case 'adelx': setDay(d, D => { D.extra = (D.extra||[]).filter(x => 'x:' + x.id !== t.dataset.k); }); sheet = sheet.prev || null; render(); return;
    case 'mvday': { const g = id => document.getElementById(id); if (g('mv-s')) sheet.mv.s = g('mv-s').value; if (g('mv-e')) sheet.mv.e = g('mv-e').value; sheet.mv.to = sheet.mv.to === v ? null : v; render(); return; }
    case 'amove': { const k = t.dataset.k, ev = findEv(d, k); if (!ev) return;
      const to = sheet.mv && sheet.mv.to, s = $('#mv-s').value, en = $('#mv-e').value;
      if (!to || to === d || !s || !en || toMin(en) <= toMin(s)){ toast('요일·시간을 확인해 주세요'); return; }
      setDay(to, D => { D.extra = D.extra || []; D.extra.push({ id:uid(), name:ev.name, start:s, end:en, place:ev.place, travel:ev.travel || 0, placeName:ev.placeName || '', note:ev.note || '', movedFrom:d, srcId:k }); });
      if (k.startsWith('x:')) setDay(d, D => { D.extra = (D.extra||[]).filter(x => 'x:' + x.id !== k); });
      else evApply(d, k, x => { x.skip = true; x.movedTo = to; });
      sheet = sheet.prev || null; ensureDays(); render(); toast(shortDate(to) + '로 옮겼습니다'); return; }
    case 'naadd': { readNew(); const f = sheet.form;
      if (!f.name.trim() || !f.start || !f.end || toMin(f.end) <= toMin(f.start)){ toast('이름·시간을 확인해 주세요'); return; }
      if (sheet.date) setDay(sheet.date, D => { D.extra = D.extra || []; D.extra.push({ id:uid(), name:f.name.trim(), start:f.start, end:f.end, place:f.place, travel:0 }); });
      else { S.academies.push({ id:uid(), name:f.name.trim(), day:f.day, start:f.start, end:f.end, place:f.place, travel:f.place === 'school' ? 10 : 0, note:'' }); saveS(); }
      toast('추가했습니다'); sheet = sheet.prev || null; render(); return; }
    case 'wdel': if (delArm !== t.dataset.id){ delArm = t.dataset.id; render(); return; } S.academies = S.academies.filter(y => y.id !== t.dataset.id); delArm = null; sheet = sheet.prev || null; saveS(); toast('삭제했습니다'); return;
    case 'setmode': S[t.dataset.f] = v; saveS(); return;
    case 'daymode': { const f = t.dataset.f; setDay(d, D => { D[f] = v; }); return; }
    case 'snum': S[t.dataset.f] = Math.max(0, (+S[t.dataset.f]||0) + +t.dataset.n); saveS(); return;
    case 'dsplit': { const x = S.daily.find(y => y.id === t.dataset.id); x.split = Math.max(1, Math.min(4, (+x.split||1) + +t.dataset.n)); saveS(); return; }
    case 'ckp': setDay(t.dataset.d || cur, D => { D.checks = D.checks || {}; const k = t.dataset.k, l = t.dataset.l; const on = !!(D.checks[k] || (l && D.checks[l])); D.checks[k] = !on; if (l) delete D.checks[l]; }); return;
    case 'ckall': { const x = checklist(cur).find(y => y.kind === 'daily' && y.id === t.dataset.id); if (!x) return;
      setDay(cur, D => { D.checks = D.checks || {};

/* 1쪽 시간표: 칸에 글자가 안 들어가면 자르지 말고 그 칸만 글자를 줄인다.
   먼저 80%까지 줄여 보고, 그래도 넘치면 앞의 시각(칸 위치로 알 수 있음)을 빼고, 최소 55%까지 줄인다. */
function fitGrid(root){
  const over = el => el.scrollHeight > el.clientHeight + .5 || el.scrollWidth > el.clientWidth + .5;
  /* 가로 펼침면: 요일 칸이 넘치면 그 요일만 글자를 줄인다 */
  root.querySelectorAll('.pq-wc').forEach(c => { const l = c; const base = parseFloat(getComputedStyle(c).fontSize); let f = 1; while (over(l) && f > .6){ f -= .04; c.style.fontSize = (base * f).toFixed(2) + 'px'; } });
  root.querySelectorAll('.pq-tq, .pq-bk').forEach(el => {
    if (!over(el)) return;
    const base = parseFloat(getComputedStyle(el).fontSize); let f = 1;
    const set = () => { el.style.fontSize = (base * f).toFixed(2) + 'px'; };
    while (over(el) && f > .8){ f -= .05; set(); }
    if (over(el)){ const t = el.querySelector('.pq-t'); if (t){ t.remove(); f = Math.min(1, f + .1); set(); } }
    while (over(el) && f > .55){ f -= .05; set(); }
  });
}
/* 2쪽부터: 조각을 단에 차례로 채우고, 넘치면 다음 단·다음 쪽으로. 요일이 단 중간에서 끊기면 '이어서' 머리를 다시 단다.
   요일 머리가 단 맨 아래에 혼자 남지 않게, 머리는 다음 줄과 함께 들어갈 때만 넣는다. */
function paginate(root){
  const src = root.querySelector('.pq-flow'); if (!src) return;
  const cols = +src.dataset.cols, headHTML = src.dataset.head, legend = src.dataset.legend;
  const items = [...src.children]; src.remove();
  let page = null, col = null, ci = 0, pn = 1;
  const newPage = () => {
    pn++;
    page = document.createElement('div'); page.className = 'pq-page';
    page.innerHTML = headHTML + `<div class="pq-cols">${'<div class="pq-col"></div>'.repeat(cols)}</div><div class="pq-ft">${legend}<span class="pq-pn">${pn}</span></div>`;
    root.appendChild(page); ci = 0; col = page.querySelectorAll('.pq-col')[0];
  };
  const nextCol = () => { ci++; if (ci >= cols) newPage(); else col = page.querySelectorAll('.pq-col')[ci]; };
  const fits = () => col.scrollHeight <= col.clientHeight + .5;
  newPage();
  let curDay = null, curHead = null;
  for (let i = 0; i < items.length; i++){
    const el = items[i];
    if (el.classList.contains('pq-day')){
      curDay = el.dataset.day; curHead = el;
      // 머리 + 다음 줄이 같이 들어가는지 본다
      const nx = items[i + 1];
      col.appendChild(el); if (nx) col.appendChild(nx);
      const ok = fits();
      if (nx) nx.remove();
      if (!ok && col.children.length > 1){ el.remove(); nextCol(); col.appendChild(el); }
      continue;
    }
    if (!el.dataset.day) curDay = null;
    // 메모는 남은 자리를 채운다. 너무 좁으면 다음 단으로
    if (el.classList.contains('pq-memob')){
      col.appendChild(el);
      if (!fits() && col.children.length > 1){ el.remove(); nextCol(); col.appendChild(el); }
      const memo = el.querySelector('.pq-memo'), room = col.clientHeight - (el.offsetTop + el.offsetHeight);   /* 단이 기준 위치라 offsetTop은 단 안에서의 거리 */
      if (room > 0) memo.style.minHeight = (memo.offsetHeight + room - 2) + 'px';
      continue;
    }
    col.appendChild(el);
    if (fits() || col.children.length === 1) continue;
    el.remove();
    /* 취침 줄이 혼자 넘어가지 않게 바로 윗줄을 데려간다 */
    const carry = el.classList.contains('pq-sl') && col.children.length > 2 && col.lastElementChild.dataset.day === el.dataset.day ? col.lastElementChild : null;
    if (carry) carry.remove();
    nextCol();
    if (curDay && el.dataset.day === curDay && curHead){
      const c = document.createElement('div'); c.className = curHead.className + ' pq-cont'; c.innerHTML = curHead.dataset.cont; col.appendChild(c);
    }
    if (carry) col.appendChild(carry);
    col.appendChild(el);
  }
}

  const css = Array.from(doc.querySelectorAll('style')).map(s => s.textContent).join('\n')
    .replace(/@page[^}]*}/g, '').replace(/@media[^{]*{([^{}]*{[^}]*})*[^}]*}/g, '').replace(/html,body\{[^}]*\}/, '').replace(/body\{[^}]*\}/, '');
  const scoped = css.replace(/(^|})\s*([^{}@]+)\{/g, (m, a, sel) => a + sel.split(',').map(x => '#pdfroot ' + x.trim()).join(',') + '{');
  const root = document.createElement('div'); root.id = 'pdfroot';
  root.style.cssText = 'position:fixed;left:-20000px;top:0;background:#fff;color:#1d1d1f;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
  root.innerHTML = `<style>${scoped}</style>` + Array.from(doc.querySelectorAll('.pq-page, .pq-flow')).map(p => p.outerHTML).join('');
  document.body.appendChild(root);
  paginate(root);
  fitGrid(root);
  try {
    const { jsPDF } = window.jspdf;
    let dim = size === 'A5' ? [148, 210] : [210, 297]; if (orient === 'landscape') dim = [dim[1], dim[0]];
    const pdf = new jsPDF({ unit:'mm', format:size.toLowerCase(), orientation:orient, compress:true });
    const pages = root.querySelectorAll('.pq-page');
    for (let i = 0; i < pages.length; i++){
      const canvas = await window.html2canvas(pages[i], { scale: size === 'A5' ? 5.4 : 4, backgroundColor:'#ffffff', logging:false, useCORS:true });
      if (i) pdf.addPage(size.toLowerCase(), orient);
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, dim[0], dim[1], undefined, 'FAST');
    }
    const blob = pdf.output('blob'), name = '주간일정표_' + weekStart + '_' + size + (orient === 'landscape' ? '_가로' : '') + '.pdf';
    if (macWebApp()){ PDFREADY = { name, blob, size }; openSheet({ type:'pdfready' }); return; }
    await saveFile(name, blob);
    toast(size + ' PDF를 받았습니다'); sheet = null; render();
  } catch(e){ if (!(e && e.code === 'declined')) toast('PDF 만들기 실패 (' + (e && (e.code || e.message) || '오류') + ')'); }
  finally { root.remove(); }
}

init();
setInterval(() => { if (!sheet && ((tab === 'today' && cur === today()) || tab === 'week' || tab === 'timer')) render(); }, 30000);
</script>
</body>
</html>
